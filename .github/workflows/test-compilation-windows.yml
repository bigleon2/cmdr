# Test de compilation de CMDR sous Windows (Task 51/52/53 — PM ghorg-to-ecosysteme.md §4 :
# « ni compiler, ni lancer » sous Linux → runner GitHub windows-latest, dérogation documentée).
# Branche dédiée test/compilation-windows (jamais la branche par défaut — règle n°3 du MD).
# Run 1 (42258574189) : MSB3644 — assemblies de référence v4.5 absentes de l'image VS18/Server 2025
# (le dev pack 4.5.2 choco ne couvre pas v4.5) → run 2 : assemblies de référence via le package
# NuGet Microsoft.NETFramework.ReferenceAssemblies.net45 + FrameworkPathOverride (sans toucher au code source).
name: Test compilation Windows (CMDR)

on:
  push:
    branches: [test/compilation-windows]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Assemblies de référence .NET Framework 4.5 (package NuGet — image sans targeting pack v4.5)
        run: nuget install Microsoft.NETFramework.ReferenceAssemblies.net45 -Version 1.0.3 -OutputDirectory "$env:RUNNER_TEMP\refasm"

      - name: NuGet restore (packages.config)
        run: nuget restore cmdr\cmdr.sln

      - name: Compilation (Release | Any CPU)
        run: |
          $fw = "$env:RUNNER_TEMP\refasm\Microsoft.NETFramework.ReferenceAssemblies.net45.1.0.3\build\.NETFramework\v4.5"
          msbuild cmdr\cmdr.sln "/p:Configuration=Release" "/p:Platform=Any CPU" "/p:FrameworkPathOverride=$fw" /m /nologo /verbosity:minimal

      - name: Artefacts (binaires Release)
        uses: actions/upload-artifact@v4
        with:
          name: cmdr-binaires-windows
          path: |
            cmdr/cmdr.Editor/bin/Release/
            cmdr/cmdr.TsiLib/bin/Release/
            cmdr/cmdr.MidiLib/bin/Release/
            cmdr/cmdr.WpfControls/bin/Release/
          if-no-files-found: warn

      - name: Résumé
        if: always()
        shell: bash
        run: |
          echo "## Test compilation CMDR (Windows — windows-latest)" >> $GITHUB_STEP_SUMMARY
          echo "Statut du job : ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "Chaîne : checkout → MSBuild → assemblies de référence NuGet (v4.5) → NuGet restore → build Release|Any CPU → artefacts" >> $GITHUB_STEP_SUMMARY
